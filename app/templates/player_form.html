<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Player登録</title>
</head>

<body>

<h1>Player登録</h1>

<form method="post">

    <p>
        Discord user ID<br>
        <input type="text" name="discord_message_id" required>
    </p>

    <p>
        Name<br>
        <input type="text" name="name" required>
    </p>

    <p>
        Created At<br>
        <input type="date" name="Created_at" required>
    </p>

    <button type="submit">
        登録
    </button>

</form>

<h2>登録済みPlayer</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Discord User ID</th>
        <th>Name</th>
        <th>登録日</th>
    </tr>

    {% for p in players %}

    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.discord_user_id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.created_at }}</td>
    </tr>

    {% endfor %}

</table>

<a href="/">戻る</a>

</body>
</html>
