<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Battle登録</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --page-background: #f3f6f8;
            --surface: #ffffff;
            --surface-muted: #f7f9fa;
            --line: #e2e8ec;
            --text: #263238;
            --muted: #71808a;
            --accent: #2f7892;
            --accent-soft: #e7f2f5;
        }

        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 34px 20px 40px;
            color: var(--text);
            background: var(--page-background);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        h1 {
            margin: 0 0 28px;
            text-align: center;
        }

        form > p,
        .players,
        form > h2,
        form > button {
            margin-right: 0;
            margin-left: 0;
        }

        form > p,
        form > h2,
        form > button {
            padding: 20px 24px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(38, 50, 56, 0.05);
        }

        form > p {
            margin-top: 0;
            margin-bottom: 24px;
            line-height: 2;
        }

        form > h2 {
            margin-top: 0;
            margin-bottom: 24px;
            padding-bottom: 12px;
            color: #344b55;
            font-size: 20px;
            border-bottom: 2px solid var(--accent-soft);
        }

        .players {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(38, 50, 56, 0.05);
        }

        .player-card {
            flex: 1;
            min-width: 0;
            padding: 20px;
            background: var(--surface-muted);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .player-card h2 {
            margin: 0 0 18px;
            color: #344b55;
            font-size: 20px;
        }

        .battle-row {
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .battle-field {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            gap: 5px;
        }

        .pokemon-field {
            flex: 1;
            min-width: 0;
        }

        label,
        form > p {
            color: var(--muted);
            font-weight: 600;
        }

        select {
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            background: var(--surface);
            border: 1px solid #c8d3d8;
            border-radius: 6px;
        }

        form > p select {
            width: min(100%, 620px);
            margin-top: 5px;
        }

        form > button {
            display: block;
            width: 100%;
            margin-top: 0;
            padding: 13px 20px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            background: var(--accent);
            border: 0;
            cursor: pointer;
        }

        form > button:hover {
            background: #25657b;
        }

        body > a {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            color: var(--accent);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 12px 32px;
            }

            h1 {
                font-size: 24px;
            }

            form > p,
            form > h2,
            form > button,
            .players {
                padding: 16px;
            }

            .players {
                flex-direction: column;
            }

            .player-card {
                padding: 16px;
            }

            .battle-row {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<h1>Battle登録</h1>

<form method="post">

    <!-- Battle Message -->
    <p>
        Battle Message<br>

        <select name="battle_message_id" required>

            {% for message in messages %}

            <option value="{{ message.id }}">
                #{{ message.id }}
                {{ message.battle_type }}
                {{ message.battle_date }}
            </option>

            {% endfor %}

        </select>

    </p>


    <!-- Player 1 / Player 2 -->
    <div class="players">

        <!-- Player 1 -->
        <div class="player-card">

            <h2>Player 1</h2>

            <div class="battle-row">

                <div class="battle-field pokemon-field">

                    <label for="player1_pokemon">
                        Pokémon
                    </label>

                    <select
                        id="player1_pokemon"
                        name="player1_pokemon_id"
                        required
                    >

                        {% for p in pokemon %}

                        <option value="{{ p.id }}">
                            {{ p.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


            </div>

        </div>


        <!-- Player 2 -->
        <div class="player-card">

            <h2>Player 2</h2>

            <div class="battle-row">

                <div class="battle-field pokemon-field">

                    <label for="player2_pokemon">
                        Pokémon
                    </label>

                    <select
                        id="player2_pokemon"
                        name="player2_pokemon_id"
                        required
                    >

                        {% for p in pokemon %}

                        <option value="{{ p.id }}">
                            {{ p.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


            </div>

        </div>

    </div>


    <!-- 対戦結果 -->
    <p class="result-card">

        <label for="player1_result">
            対戦結果（Player 1視点）
        </label>

        <select
            id="player1_result"
            name="player1_result"
            required
        >

            <option value="win">
                勝利
            </option>

            <option value="lose">
                敗北
            </option>

        </select>

    </p>


    <!-- 先攻 -->
    <p>
        <label for="first_player">
            先攻
        </label>

        <select name="first_player">

            <option value="1">
                Player 1
            </option>

            <option value="2">
                Player 2
            </option>

            <option value="">
                不明
            </option>

        </select>

    </p>


    <!-- 登録 -->
    <button type="submit">
        試合を登録
    </button>

</form>

<a href="/">
    戻る
</a>

</body>
</html>
