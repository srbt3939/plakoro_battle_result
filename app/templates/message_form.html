<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Battle Message登録</title>
    <style>
        .connection-banner {
            padding: 8px 14px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-weight: bold;
            background: {% if repo_is_dynamodb %}#fff3cd{% else %}#e7f2f5{% endif %};
            border: 1px solid {% if repo_is_dynamodb %}#ffecb5{% else %}#b6d8e2{% endif %};
        }
    </style>
</head>

<body>

<div class="connection-banner">
    接続先：{{ repo_backend_label }}
</div>

<h1>Battle Message登録</h1>

<form method="post">

    <p>
        Discord Message ID<br>
        <input type="text" name="discord_message_id" required>
    </p>

    <p>
        Season<br>
        <select name="season_id" required>
            <option value="" disabled selected>シーズンを選択</option>
            {% for season in seasons %}
            <option value="{{ season.id }}">{{ season.name }}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        Battle Date<br>
        <input type="date" name="battle_date">
    </p>

    <p>
        Raw Content<br>
        <textarea name="raw_content" rows="10" cols="60"></textarea>
    </p>

    <button type="submit">
        登録
    </button>

</form>

<a href="/">戻る</a>

</body>
</html>
