<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>プラコロ バトルデータ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

</head>


<body>

<header>

    <h1>ON PLA! プラコロ バトルデータ</h1>

    <p>
        Discordコミュニティの対戦データ
    </p>

</header>


<main>


    <!-- ===================== -->
    <!-- 概要 -->
    <!-- ===================== -->

    <section class="summary">

        <div class="summary-card">

            <span class="label">
                総試合数
            </span>

            <span
                id="total-battles"
                class="value"
            >
                -
            </span>

        </div>

        <div class="summary-card">

            <span class="label">
                使用ポケモン数
            </span>

            <span
                id="pokemon-count"
                class="value"
            >
                -
            </span>

        </div>


        <a href="input_form.html" class="summary-card" style="text-decoration: none; color: inherit; cursor: pointer;">

            <span class="label">
                戦績入力補助ツール
            </span>

            <span class="value">
                ➕
            </span>

        </a>

    </section>


    <!-- ===================== -->
    <!-- 使用率 -->
    <!-- ===================== -->

    <section class="card">

        <h2>
            📊 ポケモン使用率
        </h2>

        <div class="chart-container">

            <canvas id="usage-chart"></canvas>

        </div>

    </section>


    <!-- ===================== -->
    <!-- 使用率勝率ランキング -->
    <!-- ===================== -->

    <section class="card">

        <h2>📊 ポケモンランキング</h2>

        <div id="pokemon-ranking"></div>

    </section>


    <!-- ===================== -->
    <!-- 先攻・後攻 -->
    <!-- ===================== -->

    <section class="card">

        <h2>
            🎯 先攻・後攻戦績
        </h2>

        <div id="first-second-overall"></div>

        <div id="first-second-ranking"></div>

    </section>


    <!-- ===================== -->
    <!-- 対戦カード -->
    <!-- ===================== -->
    
    <section class="card">

        <h2>
            🔥 対戦成績
        </h2>

        <div class="matchup-filter">

            <label for="matchup-pokemon">
                ポケモンを選択
            </label>

            <select id="matchup-pokemon">
                <option value="">
                    すべてのポケモン
                </option>
            </select>

        </div>


        <div id="matchup-list"></div>

    </section>

<footer class="site-footer">
    <div class="footer-inner">
        <p class="fan-site-notice">
            本サイトは、ポケットモンスターおよびポケモン関連コンテンツの
            ファンサイトです。
        </p>

        <p class="fan-site-notice">
            株式会社ポケモン、任天堂株式会社、株式会社ゲームフリーク、
            株式会社クリーチャーズ等の公式・関連企業とは一切関係ありません。
        </p>

        <p class="copyright-notice">
            Pokémon、ポケットモンスターおよび関連する名称・画像等は、
            それぞれの権利者に帰属します。
        </p>

        <p class="footer-credit">
            © ON PLA! プラコロ バトルデータ
        </p>
    </div>
</footer>

<script src="app.js"></script>

</body>

</html>
