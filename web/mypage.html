<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ設定 | ON PLA!</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
<header>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="ダークモードに切り替え">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle-label">ダーク</span>
    </button>
    <h1>⚙️ マイページ設定</h1>
    <p>個人戦績の公開設定と戦績リセット申請</p>
</header>
<main>
    <p><a href="index.html">← トップに戻る</a></p>

    <section class="card" id="privacy-section">
        <h2>🔒 個人戦績ページの公開設定</h2>
        <p>非公開にすると、あなたのプレイヤー詳細ページはあなた本人のみ閲覧可能になります（※直近の試合一覧・ランキング集計には引き続き含まれます）。</p>
        <p id="privacy-status">読み込み中...</p>
        <button type="button" id="toggle-privacy-btn" style="padding:8px 16px; cursor:pointer;" disabled>切り替え</button>
    </section>

    <section class="card" id="reset-section">
        <h2>🔄 個人戦績リセット申請</h2>
        <p>リセットが承認されると、承認時点より後の対戦から個人詳細ページの戦績が集計されます（過去の対戦データ自体は消えません）。</p>
        <p id="reset-status">読み込み中...</p>
        <form id="reset-form">
            <label for="reset-reason" style="display:block; margin-bottom:6px;">申請理由・メモ（任意、200文字以内）</label>
            <input id="reset-reason" type="text" maxlength="200" style="width:100%; max-width:480px; padding:8px; margin-bottom:10px;">
            <br>
            <button type="submit" id="submit-reset-btn" style="padding:8px 16px; cursor:pointer;">リセットを申請する</button>
        </form>
    </section>
</main>
<script src="assets/js/api.js"></script>
<script>
async function initMyPage() {
    const mainEl = document.querySelector("main");
    try {
        const meData = await initMemberBar("");
        if (!meData?.player) return;
        let isPublic = Boolean(meData.player.isPublic);
        const privacyStatus = document.getElementById("privacy-status");
        const toggleBtn = document.getElementById("toggle-privacy-btn");

        function updatePrivacyUI() {
            privacyStatus.textContent = `現在の設定：${isPublic ? "公開（メンバー全員が閲覧可能）" : "非公開（自分のみ閲覧可能）"}`;
            toggleBtn.textContent = isPublic ? "非公開に変更する" : "公開に変更する";
            toggleBtn.disabled = false;
        }
        updatePrivacyUI();

        toggleBtn.addEventListener("click", async () => {
            toggleBtn.disabled = true;
            try {
                const res = await apiFetch("/api/me/privacy", {
                    method: "PATCH",
                    body: JSON.stringify({ isPublic: !isPublic })
                });
                isPublic = Boolean(res.isPublic);
                updatePrivacyUI();
            } catch (err) {
                alert(err.message || "更新に失敗しました。");
                toggleBtn.disabled = false;
            }
        });

        const resetStatus = document.getElementById("reset-status");
        const resetForm = document.getElementById("reset-form");
        const lastResetInfo = meData.player.resetAt ? `（前回リセット日時：${meData.player.resetAt}）` : "";
        if (meData.pendingResetRequest) {
            resetStatus.textContent = `現在、承認待ちのリセット申請があります（申請日時：${meData.pendingResetRequest.requestedAt}）${lastResetInfo}`;
            resetForm.style.display = "none";
        } else {
            resetStatus.textContent = `未処理の申請はありません。${lastResetInfo}`;
        }

        resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("submit-reset-btn");
            submitBtn.disabled = true;
            try {
                const reason = document.getElementById("reset-reason").value.trim();
                const res = await apiFetch("/api/me/reset-requests", {
                    method: "POST",
                    body: JSON.stringify({ reason })
                });
                resetStatus.textContent = `リセット申請を受け付けました（申請ID: #${res.requestId}）。管理者の承認をお待ちください。`;
                resetForm.style.display = "none";
            } catch (err) {
                alert(err.message || "申請に失敗しました。");
                submitBtn.disabled = false;
            }
        });
    } catch (err) {
        renderApiError(mainEl, err, () => window.location.reload());
    }
}
initMyPage();
</script>
</body>
</html>
