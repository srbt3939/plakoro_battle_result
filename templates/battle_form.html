```html
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Battle登録</title>

    <style>
        /* 全体 */
        body {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: sans-serif;
        }

        /* Player 1 / Player 2 を横並び */
        .players {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* プレイヤーカード */
        .player-card {
            flex: 1;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            background-color: #f8f8f8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Playerタイトル */
        .player-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Pokémonと結果を横並び */
        .battle-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        /* 各入力項目 */
        .battle-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Pokémonの選択欄を広くする */
        .pokemon-field {
            flex: 1;
        }

        /* select */
        select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background-color: white;
        }

        /* ボタン */
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        /* 戻るリンク */
        a {
            display: inline-block;
            margin-top: 20px;
        }

        /* 画面が狭い場合は縦並び */
        @media (max-width: 600px) {
            .players {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<h1>Battle登録</h1>

<form method="post">

    <!-- Battle Message -->
    <p>
        Battle Message<br>

        <select name="battle_message_id" required>

            {% for message in messages %}

            <option value="{{ message.id }}">
                #{{ message.id }}
                {{ message.battle_type }}
                {{ message.battle_date }}
            </option>

            {% endfor %}

        </select>

    </p>


    <!-- Player 1 / Player 2 -->
    <div class="players">

        <!-- Player 1 -->
        <div class="player-card">

            <h2>Player 1</h2>

            <div class="battle-row">

                <div class="battle-field pokemon-field">

                    <label for="player1_pokemon">
                        Pokémon
                    </label>

                    <select
                        id="player1_pokemon"
                        name="player1_pokemon_id"
                        required
                    >

                        {% for p in pokemon %}

                        <option value="{{ p.id }}">
                            {{ p.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="battle-field">

                    <label for="player1_result">
                        結果
                    </label>

                    <select
                        id="player1_result"
                        name="player1_result"
                    >

                        <option value="win">
                            勝利
                        </option>

                        <option value="lose">
                            敗北
                        </option>

                    </select>

                </div>

            </div>

        </div>


        <!-- Player 2 -->
        <div class="player-card">

            <h2>Player 2</h2>

            <div class="battle-row">

                <div class="battle-field pokemon-field">

                    <label for="player2_pokemon">
                        Pokémon
                    </label>

                    <select
                        id="player2_pokemon"
                        name="player2_pokemon_id"
                        required
                    >

                        {% for p in pokemon %}

                        <option value="{{ p.id }}">
                            {{ p.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="battle-field">

                    <label for="player2_result">
                        結果
                    </label>

                    <select
                        id="player2_result"
                        name="player2_result"
                    >

                        <option value="win">
                            勝利
                        </option>

                        <option value="lose">
                            敗北
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </div>


    <!-- 先攻 -->
    <h2>先攻</h2>

    <p>

        <select name="first_player">

            <option value="1">
                Player 1
            </option>

            <option value="2">
                Player 2
            </option>

        </select>

    </p>


    <!-- 登録 -->
    <button type="submit">
        試合を登録
    </button>

</form>

<a href="/">
    戻る
</a>

</body>
</html>
```
